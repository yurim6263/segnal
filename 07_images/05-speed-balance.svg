<svg xmlns="http://www.w3.org/2000/svg" style="color:#17232e" viewBox="0 0 720 206" role="img" aria-label="주조 속도가 낮을 때와 높을 때 공급과 회수 차이는 0이고, 속도가 바뀐 직후에만 잠깐 차이가 생긴다"><style>svg text{font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}svg text{fill:currentColor;font-size:13px}svg .sm{font-size:12px}svg .mut{fill:#536270}svg .bold{font-weight:700}svg .tbad{fill:#c2301c}svg .tgood{fill:#0f7a57}svg .twater{fill:#1668a8}svg .pipe{stroke:#1668a8;stroke-width:7;fill:none}svg .ln{stroke:currentColor;stroke-width:1.4;fill:none}svg .faint{stroke:#c6d1da;stroke-width:1.2;fill:none}svg .sig{stroke:#536270;stroke-width:1.4;stroke-dasharray:5 4;fill:none}svg .lbad{stroke:#c2301c;stroke-width:2;fill:none}svg .lgood{stroke:#0f7a57;stroke-width:2;fill:none}svg .lwater{stroke:#1668a8;stroke-width:2.5;fill:none}svg .box{fill:#fbfcfd;stroke:#c6d1da;stroke-width:1.4}svg .boxbad{fill:#fae6e2;stroke:#c2301c;stroke-width:1.4}svg .boxgood{fill:#dff2ea;stroke:#0f7a57;stroke-width:1.4}svg .dev{fill:#fbfcfd;stroke:#17232e;stroke-width:1.4}svg .fbad{fill:#c2301c}svg .fgood{fill:#0f7a57}svg .fwater{fill:#1668a8}svg .fmut{fill:#536270}svg .fink{fill:#17232e}svg .ongone{fill:#fbfcfd;font-weight:700}</style><rect x="0" y="0" width="720" height="206" fill="#fbfcfd"/>
      <line class="ln" x1="40" y1="156" x2="680" y2="156"/>
      <g text-anchor="middle">
        <text class="bold" x="120" y="20">속도 낮을 때</text>
        <rect class="fwater" x="72" y="76" width="44" height="80"/><rect class="fmut" x="124" y="76" width="44" height="80"/>
        <text x="94" y="70">100</text><text x="146" y="70">100</text>
        <text class="sm mut" x="94" y="174">공급</text><text class="sm mut" x="146" y="174">회수</text>
        <text class="bold" x="120" y="198">차이 0</text>

        <text class="bold" x="360" y="20">속도가 바뀐 직후</text>
        <rect class="fwater" x="312" y="60" width="44" height="96"/><rect class="fmut" x="364" y="66" width="44" height="90"/>
        <text x="334" y="54">120</text><text x="386" y="60">112</text>
        <text class="sm mut" x="334" y="174">공급</text><text class="sm mut" x="386" y="174">회수</text>
        <text class="bold tbad" x="360" y="198">차이 8 (몇 분만)</text>

        <text class="bold" x="600" y="20">속도 높을 때</text>
        <rect class="fwater" x="552" y="60" width="44" height="96"/><rect class="fmut" x="604" y="60" width="44" height="96"/>
        <text x="574" y="54">120</text><text x="626" y="54">120</text>
        <text class="sm mut" x="574" y="174">공급</text><text class="sm mut" x="626" y="174">회수</text>
        <text class="bold" x="600" y="198">차이 0</text>
      </g>
    </svg>