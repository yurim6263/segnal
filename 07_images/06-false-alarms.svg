<svg xmlns="http://www.w3.org/2000/svg" style="color:#17232e" viewBox="0 0 720 226" role="img" aria-label="3일 시험에서는 0건이지만 정상 30일을 이어서 돌리면 공장 전체 한 달에 우리 방식 약 4.7건, 고정 임계값 약 3.3건의 오경보가 난다"><style>svg text{font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}svg text{fill:currentColor;font-size:13px}svg .sm{font-size:12px}svg .mut{fill:#536270}svg .bold{font-weight:700}svg .tbad{fill:#c2301c}svg .tgood{fill:#0f7a57}svg .twater{fill:#1668a8}svg .pipe{stroke:#1668a8;stroke-width:7;fill:none}svg .ln{stroke:currentColor;stroke-width:1.4;fill:none}svg .faint{stroke:#c6d1da;stroke-width:1.2;fill:none}svg .sig{stroke:#536270;stroke-width:1.4;stroke-dasharray:5 4;fill:none}svg .lbad{stroke:#c2301c;stroke-width:2;fill:none}svg .lgood{stroke:#0f7a57;stroke-width:2;fill:none}svg .lwater{stroke:#1668a8;stroke-width:2.5;fill:none}svg .box{fill:#fbfcfd;stroke:#c6d1da;stroke-width:1.4}svg .boxbad{fill:#fae6e2;stroke:#c2301c;stroke-width:1.4}svg .boxgood{fill:#dff2ea;stroke:#0f7a57;stroke-width:1.4}svg .dev{fill:#fbfcfd;stroke:#17232e;stroke-width:1.4}svg .fbad{fill:#c2301c}svg .fgood{fill:#0f7a57}svg .fwater{fill:#1668a8}svg .fmut{fill:#536270}svg .fink{fill:#17232e}svg .ongone{fill:#fbfcfd;font-weight:700}</style><rect x="0" y="0" width="720" height="226" fill="#fbfcfd"/>
      <text class="bold" x="0" y="46">시험한 구간</text>
      <text class="bold" x="0" y="118">우리 방식</text>
      <text class="bold" x="0" y="178">고정 임계값</text>
      <rect class="fgood" x="140" y="30" width="56" height="24"/>
      <text class="tgood bold" x="206" y="47">3일: 0건</text>
      <text class="sm mut" x="290" y="47">정상 30일 연속 (표류 2배: 우리 월 168건, 고정 월 10건)</text>
      <line class="faint" x1="140" y1="114" x2="700" y2="114"/>
      <text class="sm mut" x="140" y="96">공장 전체 한 달 약 4.7건 (점 5개로 예시)</text>
      <g class="fbad"><circle cx="196" cy="114" r="5"/><circle cx="308" cy="114" r="5"/><circle cx="401" cy="114" r="5"/><circle cx="532" cy="114" r="5"/><circle cx="644" cy="114" r="5"/></g>
      <line class="faint" x1="140" y1="174" x2="700" y2="174"/>
      <text class="sm mut" x="140" y="156">공장 전체 한 달 약 3.3건 (점 3개로 예시)</text>
      <g class="fmut"><circle cx="252" cy="174" r="5"/><circle cx="457" cy="174" r="5"/><circle cx="607" cy="174" r="5"/></g>
      <line class="ln" x1="140" y1="200" x2="700" y2="200"/>
      <g class="sm mut" text-anchor="middle">
        <text x="140" y="218">0일</text><text x="327" y="218">10일</text><text x="513" y="218">20일</text><text x="700" y="218">30일</text>
      </g>
    </svg>