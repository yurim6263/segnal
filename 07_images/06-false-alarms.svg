<svg xmlns="http://www.w3.org/2000/svg" style="color:#17232e" viewBox="0 0 720 226" role="img" aria-label="3일 시험에서는 0건이지만 30일로 늘리면 바로 뜨는 경보가 여러 번 나오고, 지속 확인을 통과한 오경보는 한 달에 약 1건 남는다"><style>svg text{font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}svg text{fill:currentColor;font-size:13px}svg .sm{font-size:12px}svg .mut{fill:#536270}svg .bold{font-weight:700}svg .tbad{fill:#c2301c}svg .tgood{fill:#0f7a57}svg .twater{fill:#1668a8}svg .pipe{stroke:#1668a8;stroke-width:7;fill:none}svg .ln{stroke:currentColor;stroke-width:1.4;fill:none}svg .faint{stroke:#c6d1da;stroke-width:1.2;fill:none}svg .sig{stroke:#536270;stroke-width:1.4;stroke-dasharray:5 4;fill:none}svg .lbad{stroke:#c2301c;stroke-width:2;fill:none}svg .lgood{stroke:#0f7a57;stroke-width:2;fill:none}svg .lwater{stroke:#1668a8;stroke-width:2.5;fill:none}svg .box{fill:#fbfcfd;stroke:#c6d1da;stroke-width:1.4}svg .boxbad{fill:#fae6e2;stroke:#c2301c;stroke-width:1.4}svg .boxgood{fill:#dff2ea;stroke:#0f7a57;stroke-width:1.4}svg .dev{fill:#fbfcfd;stroke:#17232e;stroke-width:1.4}svg .fbad{fill:#c2301c}svg .fgood{fill:#0f7a57}svg .fwater{fill:#1668a8}svg .fmut{fill:#536270}svg .fink{fill:#17232e}svg .ongone{fill:#fbfcfd;font-weight:700}</style><rect x="0" y="0" width="720" height="226" fill="#fbfcfd"/>
