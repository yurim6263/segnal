<svg xmlns="http://www.w3.org/2000/svg" style="color:#17232e" viewBox="0 0 720 212" role="img" aria-label="팀의 규칙으로 데이터를 만들고 같은 팀이 채점하는 고리에, 가정을 바꾼 시험 데이터를 학습에 안 쓴 조건으로 넣어 깨지는 곳을 찾는다"><style>svg text{font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}svg text{fill:currentColor;font-size:13px}svg .sm{font-size:12px}svg .mut{fill:#536270}svg .bold{font-weight:700}svg .tbad{fill:#c2301c}svg .tgood{fill:#0f7a57}svg .twater{fill:#1668a8}svg .pipe{stroke:#1668a8;stroke-width:7;fill:none}svg .ln{stroke:currentColor;stroke-width:1.4;fill:none}svg .faint{stroke:#c6d1da;stroke-width:1.2;fill:none}svg .sig{stroke:#536270;stroke-width:1.4;stroke-dasharray:5 4;fill:none}svg .lbad{stroke:#c2301c;stroke-width:2;fill:none}svg .lgood{stroke:#0f7a57;stroke-width:2;fill:none}svg .lwater{stroke:#1668a8;stroke-width:2.5;fill:none}svg .box{fill:#fbfcfd;stroke:#c6d1da;stroke-width:1.4}svg .boxbad{fill:#fae6e2;stroke:#c2301c;stroke-width:1.4}svg .boxgood{fill:#dff2ea;stroke:#0f7a57;stroke-width:1.4}svg .dev{fill:#fbfcfd;stroke:#17232e;stroke-width:1.4}svg .fbad{fill:#c2301c}svg .fgood{fill:#0f7a57}svg .fwater{fill:#1668a8}svg .fmut{fill:#536270}svg .fink{fill:#17232e}svg .ongone{fill:#fbfcfd;font-weight:700}</style><rect x="0" y="0" width="720" height="212" fill="#fbfcfd"/>
      <defs>
        <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
        <marker id="a4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f7a57"/></marker>
      </defs>
      <g text-anchor="middle">
        <rect class="box" x="20" y="24" width="180" height="56"/><text x="110" y="57">팀이 규칙을 정함</text>
        <rect class="box" x="270" y="24" width="180" height="56"/><text x="360" y="57">시뮬레이터가 데이터 생성</text>
        <rect class="box" x="520" y="24" width="180" height="56"/><text x="610" y="57">우리 방식으로 채점</text>
        <text class="sm mut" x="235" y="44">가정</text><text class="sm mut" x="485" y="44">문제</text>
      </g>
      <line class="ln" x1="200" y1="52" x2="268" y2="52" marker-end="url(#a4)"/>
