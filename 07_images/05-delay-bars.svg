<svg xmlns="http://www.w3.org/2000/svg" style="color:#17232e" viewBox="0 0 720 300" role="img" aria-label="감지까지 걸린 시간(중앙값): 고정 임계값 455분(30건 중 16건), 60분 이동평균 보정 없음 80.5분, 보정 있음 62분, EWMA 보정 없음 202분, 우리 EWMA 59.5분. 오경보는 각각 0.20, 2.95, 2.36, 0.33, 0.00"><style>svg text{font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}svg text{fill:currentColor;font-size:13px}svg .sm{font-size:12px}svg .mut{fill:#536270}svg .bold{font-weight:700}svg .tbad{fill:#c2301c}svg .tgood{fill:#0f7a57}svg .twater{fill:#1668a8}svg .pipe{stroke:#1668a8;stroke-width:7;fill:none}svg .ln{stroke:currentColor;stroke-width:1.4;fill:none}svg .faint{stroke:#c6d1da;stroke-width:1.2;fill:none}svg .sig{stroke:#536270;stroke-width:1.4;stroke-dasharray:5 4;fill:none}svg .lbad{stroke:#c2301c;stroke-width:2;fill:none}svg .lgood{stroke:#0f7a57;stroke-width:2;fill:none}svg .lwater{stroke:#1668a8;stroke-width:2.5;fill:none}svg .box{fill:#fbfcfd;stroke:#c6d1da;stroke-width:1.4}svg .boxbad{fill:#fae6e2;stroke:#c2301c;stroke-width:1.4}svg .boxgood{fill:#dff2ea;stroke:#0f7a57;stroke-width:1.4}svg .dev{fill:#fbfcfd;stroke:#17232e;stroke-width:1.4}svg .fbad{fill:#c2301c}svg .fgood{fill:#0f7a57}svg .fwater{fill:#1668a8}svg .fmut{fill:#536270}svg .fink{fill:#17232e}svg .ongone{fill:#fbfcfd;font-weight:700}</style><rect x="0" y="0" width="720" height="300" fill="#fbfcfd"/>
      <line class="ln" x1="150" y1="14" x2="150" y2="262"/>
      <text x="142" y="44" text-anchor="end">고정 임계값</text>
      <rect class="fbad" x="150" y="24" width="546" height="32"/>
      <text class="ongone" x="686" y="45" text-anchor="end">455분 · 30건 중 16건만 잡음 · 오경보 0.20</text>
      <text x="142" y="98" text-anchor="end">이동평균 60분</text>
      <text class="sm mut" x="142" y="113" text-anchor="end">(운전점 보정 없음)</text>
      <rect class="fmut" x="150" y="78" width="97" height="32"/>
      <text class="bold" x="257" y="99">80.5분 · 30건 모두 · 오경보 2.95</text>
      <text x="142" y="152" text-anchor="end">이동평균 60분</text>
      <text class="sm mut" x="142" y="167" text-anchor="end">(보정 있음)</text>
      <rect class="fmut" x="150" y="132" width="74" height="32"/>
      <text class="bold" x="234" y="153">62분 · 30건 모두 · 오경보 2.36</text>
      <text x="142" y="206" text-anchor="end">EWMA</text>
      <text class="sm mut" x="142" y="221" text-anchor="end">(보정 없음)</text>
      <rect class="fmut" x="150" y="186" width="242" height="32"/>
      <text class="bold" x="402" y="207">202분 · 30건 모두 · 오경보 0.33</text>
