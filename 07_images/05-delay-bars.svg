      <text class="sm mut" x="150" y="292">평균만 내도 455분이 80.5분이 된다(약 375분 단축). 우리 몫은 비슷한 속도(62분 → 59.5분)에서 오경보를 2.36 → 0.00으로 낮춘 것이다.</text>
