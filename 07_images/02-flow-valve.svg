<svg xmlns="http://www.w3.org/2000/svg" style="color:#17232e" viewBox="0 0 720 306" role="img" aria-label="밸브가 없으면 압력과 유량이 함께 떨어져 펌프 이상을 잡고, 밸브가 유량을 유지하면 유량 조건이 맞지 않아 0건을 잡는다"><style>svg text{font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}svg text{fill:currentColor;font-size:13px}svg .sm{font-size:12px}svg .mut{fill:#536270}svg .bold{font-weight:700}svg .tbad{fill:#c2301c}svg .tgood{fill:#0f7a57}svg .twater{fill:#1668a8}svg .pipe{stroke:#1668a8;stroke-width:7;fill:none}svg .ln{stroke:currentColor;stroke-width:1.4;fill:none}svg .faint{stroke:#c6d1da;stroke-width:1.2;fill:none}svg .sig{stroke:#536270;stroke-width:1.4;stroke-dasharray:5 4;fill:none}svg .lbad{stroke:#c2301c;stroke-width:2;fill:none}svg .lgood{stroke:#0f7a57;stroke-width:2;fill:none}svg .lwater{stroke:#1668a8;stroke-width:2.5;fill:none}svg .box{fill:#fbfcfd;stroke:#c6d1da;stroke-width:1.4}svg .boxbad{fill:#fae6e2;stroke:#c2301c;stroke-width:1.4}svg .boxgood{fill:#dff2ea;stroke:#0f7a57;stroke-width:1.4}svg .dev{fill:#fbfcfd;stroke:#17232e;stroke-width:1.4}svg .fbad{fill:#c2301c}svg .fgood{fill:#0f7a57}svg .fwater{fill:#1668a8}svg .fmut{fill:#536270}svg .fink{fill:#17232e}svg .ongone{fill:#fbfcfd;font-weight:700}</style><rect x="0" y="0" width="720" height="306" fill="#fbfcfd"/>
      <defs>
        <marker id="a2w" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1668a8"/></marker>
        <marker id="a2m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#536270"/></marker>
      </defs>
      <g transform="translate(0 8)">
        <text class="bold" x="4" y="14">밸브가 없을 때 (지금 시뮬레이터)</text>
        <line class="pipe" x1="76" y1="72" x2="436" y2="72" marker-end="url(#a2w)"/>
        <circle class="dev" cx="50" cy="72" r="27"/><text x="50" y="77" text-anchor="middle" class="bold">펌프</text>
        <text class="sm tbad" x="50" y="118" text-anchor="middle">약해짐</text>
        <circle class="dev" cx="170" cy="72" r="20"/><text class="sm" x="170" y="76" text-anchor="middle">압력</text>
        <text class="sm tbad bold" x="170" y="112" text-anchor="middle">낮아짐</text>
        <circle class="dev" cx="385" cy="72" r="20"/><text class="sm" x="385" y="76" text-anchor="middle">유량</text>
        <text class="sm tbad bold" x="385" y="112" text-anchor="middle">줄어듦</text>
        <text class="sm mut" x="470" y="58" text-anchor="end">세그먼트로</text>
        <path class="sig" d="M416 108H494" marker-end="url(#a2m)"/>
        <text class="sm mut" x="452" y="101" text-anchor="middle">센서값</text>
        <rect class="boxgood" x="498" y="40" width="216" height="84"/>
        <text x="606" y="72" text-anchor="middle">압력↓ 유량↓ 둘 다 맞음</text>
        <text class="tgood bold" x="606" y="100" text-anchor="middle">펌프 이상 24/24</text>
      </g>
      <g transform="translate(0 160)">
        <text class="bold" x="4" y="14">밸브가 유량을 붙잡을 때</text>
        <line class="pipe" x1="76" y1="72" x2="436" y2="72" marker-end="url(#a2w)"/>
        <circle class="dev" cx="50" cy="72" r="27"/><text x="50" y="77" text-anchor="middle" class="bold">펌프</text>
        <text class="sm tbad" x="50" y="118" text-anchor="middle">약해짐</text>
        <circle class="dev" cx="170" cy="72" r="20"/><text class="sm" x="170" y="76" text-anchor="middle">압력</text>
        <text class="sm tbad bold" x="170" y="112" text-anchor="middle">낮아짐</text>
        <polygon class="dev" points="262,54 262,90 298,54 298,90"/>
        <text class="sm bold" x="280" y="44" text-anchor="middle">밸브 더 열림</text>
        <circle class="dev" cx="385" cy="72" r="20"/><text class="sm" x="385" y="76" text-anchor="middle">유량</text>
        <text class="sm twater bold" x="385" y="112" text-anchor="middle">그대로</text>
        <text class="sm mut" x="470" y="58" text-anchor="end">세그먼트로</text>
        <path class="sig" d="M416 108H494" marker-end="url(#a2m)"/>
        <text class="sm mut" x="452" y="101" text-anchor="middle">센서값</text>
        <rect class="boxbad" x="498" y="40" width="216" height="84"/>
        <text x="606" y="72" text-anchor="middle">유량↓ 조건이 안 맞음</text>
        <text class="tbad bold" x="606" y="100" text-anchor="middle">펌프 이상 0/24</text>
      </g>
    </svg>