<svg xmlns="http://www.w3.org/2000/svg" style="color:#17232e" viewBox="0 0 720 300" role="img" aria-label="입구 근처 누수는 입구 유량이 늘어 누수로 판정되고, 출구 근처 누수는 회수 유량만 줄어 센서 고장으로 잘못 판정된다"><style>svg text{font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}svg text{fill:currentColor;font-size:13px}svg .sm{font-size:12px}svg .mut{fill:#536270}svg .bold{font-weight:700}svg .tbad{fill:#c2301c}svg .tgood{fill:#0f7a57}svg .twater{fill:#1668a8}svg .pipe{stroke:#1668a8;stroke-width:7;fill:none}svg .ln{stroke:currentColor;stroke-width:1.4;fill:none}svg .faint{stroke:#c6d1da;stroke-width:1.2;fill:none}svg .sig{stroke:#536270;stroke-width:1.4;stroke-dasharray:5 4;fill:none}svg .lbad{stroke:#c2301c;stroke-width:2;fill:none}svg .lgood{stroke:#0f7a57;stroke-width:2;fill:none}svg .lwater{stroke:#1668a8;stroke-width:2.5;fill:none}svg .box{fill:#fbfcfd;stroke:#c6d1da;stroke-width:1.4}svg .boxbad{fill:#fae6e2;stroke:#c2301c;stroke-width:1.4}svg .boxgood{fill:#dff2ea;stroke:#0f7a57;stroke-width:1.4}svg .dev{fill:#fbfcfd;stroke:#17232e;stroke-width:1.4}svg .fbad{fill:#c2301c}svg .fgood{fill:#0f7a57}svg .fwater{fill:#1668a8}svg .fmut{fill:#536270}svg .fink{fill:#17232e}svg .ongone{fill:#fbfcfd;font-weight:700}</style><rect x="0" y="0" width="720" height="300" fill="#fbfcfd"/>
      <defs>
        <marker id="a3w" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1668a8"/></marker>
        <marker id="a3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2301c"/></marker>
        <marker id="a3m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#536270"/></marker>
      </defs>
      <g transform="translate(0 6)">
        <text class="bold" x="4" y="14">구멍이 입구 근처</text>
        <line class="pipe" x1="30" y1="66" x2="462" y2="66" marker-end="url(#a3w)"/>
        <circle class="dev" cx="110" cy="66" r="21"/><text class="sm" x="110" y="70" text-anchor="middle">입구</text>
        <text class="bold tbad" x="110" y="36" text-anchor="middle">110 (늘어남)</text>
        <line class="lbad" x1="190" y1="70" x2="190" y2="110" marker-end="url(#a3b)"/>
        <text class="sm tbad bold" x="200" y="104">10 샘</text>
        <circle class="dev" cx="400" cy="66" r="21"/><text class="sm" x="400" y="70" text-anchor="middle">회수</text>
        <text class="bold" x="400" y="36" text-anchor="middle">100</text>
        <path class="sig" d="M430 102H498" marker-end="url(#a3m)"/>
        <text class="sm mut" x="464" y="95" text-anchor="middle">센서값</text>
        <rect class="boxgood" x="502" y="30" width="212" height="84"/>
        <text x="608" y="62" text-anchor="middle">입구 유량이 늘었네</text>
        <text class="tgood bold" x="608" y="90" text-anchor="middle">누수 (맞음)</text>
      </g>
      <g transform="translate(0 160)">
        <text class="bold" x="4" y="14">구멍이 출구 근처</text>
        <line class="pipe" x1="30" y1="66" x2="462" y2="66" marker-end="url(#a3w)"/>
        <circle class="dev" cx="110" cy="66" r="21"/><text class="sm" x="110" y="70" text-anchor="middle">입구</text>
        <text class="bold" x="110" y="36" text-anchor="middle">100</text>
        <line class="lbad" x1="320" y1="70" x2="320" y2="110" marker-end="url(#a3b)"/>
        <text class="sm tbad bold" x="330" y="104">10 샘</text>
        <circle class="dev" cx="400" cy="66" r="21"/><text class="sm" x="400" y="70" text-anchor="middle">회수</text>
        <text class="bold tbad" x="400" y="36" text-anchor="middle">90 (줄어듦)</text>
        <path class="sig" d="M430 102H498" marker-end="url(#a3m)"/>
        <text class="sm mut" x="464" y="95" text-anchor="middle">센서값</text>
        <rect class="boxbad" x="502" y="30" width="212" height="84"/>
        <text x="608" y="62" text-anchor="middle">입구 유량 변화가 없네</text>
        <text class="tbad bold" x="608" y="90" text-anchor="middle">센서 고장 (틀림)</text>
      </g>
    </svg>