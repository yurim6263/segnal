<svg xmlns="http://www.w3.org/2000/svg" style="color:#17232e" viewBox="0 0 720 282" role="img" aria-label="현장이 고정선만 볼 때는 우리가 훨씬 먼저 알지만, 현장이 이미 추세를 보면 차이가 거의 없다"><style>svg text{font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}svg text{fill:currentColor;font-size:13px}svg .sm{font-size:12px}svg .mut{fill:#536270}svg .bold{font-weight:700}svg .tbad{fill:#c2301c}svg .tgood{fill:#0f7a57}svg .twater{fill:#1668a8}svg .pipe{stroke:#1668a8;stroke-width:7;fill:none}svg .ln{stroke:currentColor;stroke-width:1.4;fill:none}svg .faint{stroke:#c6d1da;stroke-width:1.2;fill:none}svg .sig{stroke:#536270;stroke-width:1.4;stroke-dasharray:5 4;fill:none}svg .lbad{stroke:#c2301c;stroke-width:2;fill:none}svg .lgood{stroke:#0f7a57;stroke-width:2;fill:none}svg .lwater{stroke:#1668a8;stroke-width:2.5;fill:none}svg .box{fill:#fbfcfd;stroke:#c6d1da;stroke-width:1.4}svg .boxbad{fill:#fae6e2;stroke:#c2301c;stroke-width:1.4}svg .boxgood{fill:#dff2ea;stroke:#0f7a57;stroke-width:1.4}svg .dev{fill:#fbfcfd;stroke:#17232e;stroke-width:1.4}svg .fbad{fill:#c2301c}svg .fgood{fill:#0f7a57}svg .fwater{fill:#1668a8}svg .fmut{fill:#536270}svg .fink{fill:#17232e}svg .ongone{fill:#fbfcfd;font-weight:700}</style><rect x="0" y="0" width="720" height="282" fill="#fbfcfd"/>
      <defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0f7a57"/></marker></defs>
      <g id="p1">
        <text class="bold" x="20" y="18">우리가 가정한 현장</text>
        <line class="ln" x1="30" y1="40" x2="30" y2="225"/><line class="ln" x1="30" y1="225" x2="335" y2="225"/>
        <text class="sm mut" x="335" y="243" text-anchor="end">시간</text>
        <line class="lbad" x1="30" y1="100" x2="335" y2="100" stroke-dasharray="7 5"/>
        <text class="sm tbad" x="38" y="92">고정 기준선</text>
        <polyline class="lwater" points="30,210 60,210 320,70"/>
        <circle class="fgood" cx="130" cy="172" r="7"/><text class="tgood bold" x="120" y="160" text-anchor="end">우리 주의</text>
        <circle class="fbad" cx="264" cy="100" r="7"/><text class="tbad bold" x="272" y="122">고정선 경보</text>
        <line stroke="#0f7a57" stroke-width="2" x1="132" y1="256" x2="262" y2="256" marker-start="url(#a1)" marker-end="url(#a1)"/>
        <text class="tgood bold" x="197" y="276" text-anchor="middle">먼저 알게 된 시간</text>
      </g>
      <g transform="translate(375 0)">
        <text class="bold" x="20" y="18">현장이 이미 추세를 본다면</text>
        <line class="ln" x1="30" y1="40" x2="30" y2="225"/><line class="ln" x1="30" y1="225" x2="335" y2="225"/>
        <text class="sm mut" x="335" y="243" text-anchor="end">시간</text>
        <line class="lbad" x1="30" y1="100" x2="335" y2="100" stroke-dasharray="7 5"/>
        <text class="sm tbad" x="38" y="92">고정 기준선</text>
        <polyline class="lwater" points="30,210 60,210 320,70"/>
        <circle class="fgood" cx="130" cy="172" r="7"/><text class="tgood bold" x="120" y="160" text-anchor="end">우리 주의</text>
        <circle class="fink" cx="152" cy="160" r="7"/><text class="bold" x="162" y="182">현장 추세 확인</text>
        <line stroke="#0f7a57" stroke-width="2" x1="132" y1="256" x2="150" y2="256"/>
        <text class="tgood bold" x="141" y="276" text-anchor="middle">차이가 거의 없음</text>
      </g>
    </svg>