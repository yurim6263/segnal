<svg xmlns="http://www.w3.org/2000/svg" style="color:#17232e" viewBox="0 0 720 176" role="img" aria-label="현장 전제가 시뮬레이터로, 실험 숫자로, 발표 문장으로 이어지고 여섯 허점이 이 순서 위에 놓여 있다"><style>svg text{font-family:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif}svg text{fill:currentColor;font-size:13px}svg .sm{font-size:12px}svg .mut{fill:#536270}svg .bold{font-weight:700}svg .tbad{fill:#c2301c}svg .tgood{fill:#0f7a57}svg .twater{fill:#1668a8}svg .pipe{stroke:#1668a8;stroke-width:7;fill:none}svg .ln{stroke:currentColor;stroke-width:1.4;fill:none}svg .faint{stroke:#c6d1da;stroke-width:1.2;fill:none}svg .sig{stroke:#536270;stroke-width:1.4;stroke-dasharray:5 4;fill:none}svg .lbad{stroke:#c2301c;stroke-width:2;fill:none}svg .lgood{stroke:#0f7a57;stroke-width:2;fill:none}svg .lwater{stroke:#1668a8;stroke-width:2.5;fill:none}svg .box{fill:#fbfcfd;stroke:#c6d1da;stroke-width:1.4}svg .boxbad{fill:#fae6e2;stroke:#c2301c;stroke-width:1.4}svg .boxgood{fill:#dff2ea;stroke:#0f7a57;stroke-width:1.4}svg .dev{fill:#fbfcfd;stroke:#17232e;stroke-width:1.4}svg .fbad{fill:#c2301c}svg .fgood{fill:#0f7a57}svg .fwater{fill:#1668a8}svg .fmut{fill:#536270}svg .fink{fill:#17232e}svg .ongone{fill:#fbfcfd;font-weight:700}</style><rect x="0" y="0" width="720" height="176" fill="#fbfcfd"/>
      <defs><marker id="a0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs>
      <g text-anchor="middle">
        <rect class="box" x="10" y="26" width="130" height="58"/><text class="bold" x="75" y="60">현장 전제</text>
        <rect class="box" x="200" y="26" width="130" height="58"/><text class="bold" x="265" y="60">시뮬레이터</text>
        <rect class="box" x="390" y="26" width="130" height="58"/><text class="bold" x="455" y="60">실험 숫자</text>
        <rect class="box" x="580" y="26" width="130" height="58"/><text class="bold" x="645" y="60">발표 문장</text>
        <text class="sm mut" x="170" y="46">가정으로</text><text class="sm mut" x="360" y="46">시험해서</text><text class="sm mut" x="550" y="46">요약해서</text>
      </g>
      <line class="ln" x1="140" y1="55" x2="198" y2="55" marker-end="url(#a0)"/>
      <line class="ln" x1="330" y1="55" x2="388" y2="55" marker-end="url(#a0)"/>
      <line class="ln" x1="520" y1="55" x2="578" y2="55" marker-end="url(#a0)"/>
      <g class="sm">
        <circle class="fbad" cx="22" cy="116" r="10"/><text class="ongone" x="22" y="120" text-anchor="middle">1</text><text x="38" y="120">고정선 감시?</text>
        <circle class="fbad" cx="22" cy="148" r="10"/><text class="ongone" x="22" y="152" text-anchor="middle">2</text><text x="38" y="152">유량 제어?</text>
        <circle class="fbad" cx="212" cy="116" r="10"/><text class="ongone" x="212" y="120" text-anchor="middle">3</text><text x="228" y="120">출구 쪽 누수</text>
        <circle class="fbad" cx="212" cy="148" r="10"/><text class="ongone" x="212" y="152" text-anchor="middle">4</text><text x="228" y="152">셀프 채점</text>
        <circle class="fbad" cx="402" cy="116" r="10"/><text class="ongone" x="402" y="120" text-anchor="middle">5</text><text x="418" y="120">이득의 출처</text>
        <circle class="fbad" cx="592" cy="116" r="10"/><text class="ongone" x="592" y="120" text-anchor="middle">6</text><text x="608" y="120">오경보 없음</text>
